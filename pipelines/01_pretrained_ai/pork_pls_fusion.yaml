metadata:
  name: pork_pls_fusion
  description: 'Pork belly fat from the 512 ResNet-18 spatial and 300 spectral features:
    three PLS models (spatial, spectral, stacked) with five-fold component selection,
    and the average of the spatial and spectral predictions.'
  created: ''
  tags:
  - course
  - pls
  - fusion
  author: Cubert GmbH
  cuvis_ai_version: 0.14.4
plugins:
- cuvis_ai_builtin
- cuvis_ai_wur_course
nodes:
- name: frame
  class_name: cuvis_ai_wur_course.node.source.CourseFrame
  hparams:
    keys:
    - wavelengths
    - target
    - fold
- name: standardize
  class_name: cuvis_ai.node.pretreatments.standardize.Standardize
  hparams:
    axis: channel
    with_mean: true
    with_std: true
    stats: fit
    mean: null
    std: null
    ddof: 1
    eps: 1.0e-08
    eps_mode: floor
    exclude_folds: null
    max_initialization_frames: null
    layout: bhwc
- name: spatial_block
  class_name: cuvis_ai_wur_course.node.fusion.ChannelSlice
  hparams:
    start: 0
    stop: 512
- name: spectral_block
  class_name: cuvis_ai_wur_course.node.fusion.ChannelSlice
  hparams:
    start: 512
    stop: 812
- name: pls_spatial
  class_name: cuvis_ai_wur_course.node.regression.PLSRegression
  hparams:
    input_channels: 512
    n_targets: 1
    n_components: null
    max_components: 20
    holdout_folds: each
    refit_on_holdout: true
    eps: 1.0e-12
- name: pls_spectral
  class_name: cuvis_ai_wur_course.node.regression.PLSRegression
  hparams:
    input_channels: 300
    n_targets: 1
    n_components: null
    max_components: 20
    holdout_folds: each
    refit_on_holdout: true
    eps: 1.0e-12
- name: pls_stacked
  class_name: cuvis_ai_wur_course.node.regression.PLSRegression
  hparams:
    input_channels: 812
    n_targets: 1
    n_components: null
    max_components: 20
    holdout_folds: each
    refit_on_holdout: true
    eps: 1.0e-12
- name: metrics_spatial
  class_name: cuvis_ai_wur_course.node.metrics.RegressionMetrics
  hparams: {}
- name: metrics_spectral
  class_name: cuvis_ai_wur_course.node.metrics.RegressionMetrics
  hparams: {}
- name: metrics_stacked
  class_name: cuvis_ai_wur_course.node.metrics.RegressionMetrics
  hparams: {}
- name: fusion
  class_name: cuvis_ai_wur_course.node.fusion.PredictionMean
  hparams:
    name: null
- name: metrics_fusion
  class_name: cuvis_ai_wur_course.node.metrics.RegressionMetrics
  hparams: {}
connections:
- source: frame.outputs.cube
  target: standardize.inputs.cube
- source: frame.outputs.wavelengths
  target: spatial_block.inputs.wavelengths
- source: frame.outputs.wavelengths
  target: spectral_block.inputs.wavelengths
- source: frame.outputs.target
  target: pls_spatial.inputs.target
- source: frame.outputs.fold
  target: pls_spatial.inputs.fold
- source: frame.outputs.target
  target: pls_spectral.inputs.target
- source: frame.outputs.fold
  target: pls_spectral.inputs.fold
- source: frame.outputs.target
  target: pls_stacked.inputs.target
- source: frame.outputs.fold
  target: pls_stacked.inputs.fold
- source: frame.outputs.target
  target: metrics_spatial.inputs.target
- source: frame.outputs.target
  target: metrics_spectral.inputs.target
- source: frame.outputs.target
  target: metrics_stacked.inputs.target
- source: frame.outputs.target
  target: metrics_fusion.inputs.target
- source: standardize.outputs.cube
  target: spatial_block.inputs.cube
- source: standardize.outputs.cube
  target: spectral_block.inputs.cube
- source: standardize.outputs.cube
  target: pls_stacked.inputs.cube
- source: spatial_block.outputs.cube
  target: pls_spatial.inputs.cube
- source: spectral_block.outputs.cube
  target: pls_spectral.inputs.cube
- source: pls_spatial.outputs.prediction
  target: metrics_spatial.inputs.prediction
- source: pls_spatial.outputs.prediction
  target: fusion.inputs.prediction
- source: pls_spectral.outputs.prediction
  target: metrics_spectral.inputs.prediction
- source: pls_spectral.outputs.prediction
  target: fusion.inputs.prediction
- source: pls_stacked.outputs.prediction
  target: metrics_stacked.inputs.prediction
- source: fusion.outputs.prediction
  target: metrics_fusion.inputs.prediction
