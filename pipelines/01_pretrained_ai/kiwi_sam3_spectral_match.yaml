metadata:
  name: kiwi_sam3_spectral_match
  description: Kiwi cube to pseudo-RGB, SAM3 segment-everything, the course's size
    filter and spectral-angle filter side by side, one kiwi cropped to 256 px and
    embedded with ResNet-18.
  created: ''
  tags:
  - course
  - sam3
  - spectral-match
  - resnet18
  author: Cubert GmbH
  cuvis_ai_version: 0.14.4
plugins:
- cuvis_ai_builtin
- cuvis_ai_wur_course
- sam3
nodes:
- name: frame
  class_name: cuvis_ai_wur_course.node.source.CourseFrame
  hparams:
    name: null
- name: pseudo_rgb
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 575.0
    - 535.0
    - 445.0
    normalize_output: true
    norm_mode: running
    apply_gamma: true
    freeze_running_bounds_after_frames: 20
    running_warmup_frames: 10
- name: sam3
  class_name: cuvis_ai_sam3.node.SAM3SegmentEverything
  hparams:
    checkpoint_path: null
    device: null
    compile_model: false
    points_per_side: 32
    points_per_batch: 64
    pred_iou_thresh: 0.8
    stability_score_thresh: 0.95
    stability_score_offset: 1.0
    mask_threshold: 0.0
    box_nms_thresh: 0.7
    crop_n_layers: 0
    crop_nms_thresh: 0.7
    crop_overlap_ratio: 0.3413333333333333
    crop_n_points_downscale_factor: 1
    min_mask_region_area: 0
    multimask_output: true
- name: size_filter
  class_name: cuvis_ai_wur_course.node.kiwi.LabelBBoxFilter
  hparams:
    min_height: 50
    max_height: 120
    min_width: 150
    max_width: 210
    max_labels: 1024
- name: count_size_filter
  class_name: cuvis_ai.node.metrics.DistinctLabelCount
  hparams: {}
- name: object_spectra
  class_name: cuvis_ai.node.spectral_extractor.SpectralSignatureExtractor
  hparams:
    trim_fraction: 0.0
    min_mask_pixels: 1
    zero_norm_threshold: 1.0e-08
- name: object_references
  class_name: cuvis_ai.node.spectral_extractor.SignaturesToReferences
  hparams:
    normalize: null
- name: kiwi_angle
  class_name: cuvis_ai.node.spectral_angle_mapper.SpectralAngleMapper
  hparams:
    num_channels: null
    eps: 1.0e-12
- name: kiwi_reference
  class_name: cuvis_ai.node.numpy_file.NpyReader
  hparams:
    file_path: data\course\kiwi\kiwi_reference.npy
- name: kiwi_decision
  class_name: cuvis_ai.node.deciders.binary_decider.ScoreThreshold
  hparams:
    threshold: 0.035
    keep: below
- name: spectral_filter
  class_name: cuvis_ai_wur_course.node.kiwi.LabelKeep
  hparams:
    max_labels: 1024
- name: count_spectral_filter
  class_name: cuvis_ai.node.metrics.DistinctLabelCount
  hparams: {}
- name: kiwi_crop
  class_name: cuvis_ai_wur_course.node.kiwi.LabelCropPad
  hparams:
    canvas_size: 256
    label_selection: first
- name: crop_rgb
  class_name: cuvis_ai.node.channel_selector.FixedWavelengthSelector
  hparams:
    target_wavelengths:
    - 575.0
    - 535.0
    - 445.0
    normalize_output: true
    norm_mode: running
    apply_gamma: true
    freeze_running_bounds_after_frames: 20
    running_warmup_frames: 10
- name: features
  class_name: cuvis_ai_wur_course.node.features.ResNet18Features
  hparams:
    weights: imagenet
connections:
- source: frame.outputs.cube
  target: pseudo_rgb.inputs.cube
- source: frame.outputs.wavelengths
  target: pseudo_rgb.inputs.wavelengths
- source: frame.outputs.cube
  target: object_spectra.inputs.cube
- source: frame.outputs.wavelengths
  target: object_spectra.inputs.wavelengths
- source: frame.outputs.cube
  target: kiwi_crop.inputs.cube
- source: frame.outputs.wavelengths
  target: crop_rgb.inputs.wavelengths
- source: pseudo_rgb.outputs.rgb_image
  target: sam3.inputs.rgb_image
- source: sam3.outputs.mask
  target: size_filter.inputs.mask
- source: sam3.outputs.mask
  target: object_spectra.inputs.mask
- source: sam3.outputs.object_ids
  target: object_spectra.inputs.object_ids
- source: sam3.outputs.mask
  target: spectral_filter.inputs.mask
- source: sam3.outputs.object_ids
  target: spectral_filter.inputs.object_ids
- source: size_filter.outputs.mask
  target: count_size_filter.inputs.mask
- source: object_spectra.outputs.signatures
  target: object_references.inputs.signatures
- source: object_references.outputs.spectral_signature
  target: kiwi_angle.inputs.cube
- source: kiwi_angle.outputs.best_scores
  target: kiwi_decision.inputs.scores
- source: kiwi_reference.outputs.data
  target: kiwi_angle.inputs.spectral_signature
- source: kiwi_decision.outputs.decisions
  target: spectral_filter.inputs.decisions
- source: spectral_filter.outputs.mask
  target: count_spectral_filter.inputs.mask
- source: spectral_filter.outputs.mask
  target: kiwi_crop.inputs.mask
- source: kiwi_crop.outputs.crop
  target: crop_rgb.inputs.cube
- source: crop_rgb.outputs.rgb_image
  target: features.inputs.image
