[project]
name = "cuvis-ai-wur-course"
dynamic = ["version"]
description = "The WUR 2026 course notebooks (chemometrics on hyperspectral images) rebuilt as cuvis-ai nodes, pipelines and notebooks."
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Nima Ghorbani", email = "ghorbani3@cubert-gmbh.de" },
]
maintainers = [
  { name = "Cubert GmbH", email = "cuvis.ai@cubert-gmbh.de" },
]
license = { text = "Apache-2.0" }
readme = "README.md"

keywords = [
  "cuvis",
  "hyperspectral",
  "chemometrics",
  "pls",
  "course",
  "plugin",
  "cuvis-ai",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Operating System :: OS Independent",
]

dependencies = [
  "cuvis-ai>=0.21.0",
  "cuvis-ai-core>=0.19.0",
  "cuvis-ai-schemas>=0.14.2,<0.15",
  "cuvis-ai-dataloader>=0.8.2",
  "torch>=2.1",
  "torchvision",
  "numpy",
  "scipy",
  "scikit-learn",
  "pandas",
  "huggingface_hub",
  "click",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
  "bandit",
  "detect-secrets",
  "pip-audit",
  "twine>=6.2.0",
  "ikpls>=6.1",
]
notebooks = [
  "jupyter",
  "nbconvert",
  "matplotlib",
]
plugins = [
    "cuvis-ai-sam3",
    "cuvis-ai-ultralytics",
]

[project.scripts]
prepare-course-data = "cuvis_ai_wur_course.prepare_data:main"

[project.urls]
Homepage   = "https://docs.cuvis.ai/latest/"
Repository = "https://github.com/cubert-hyperspectral/cuvis-ai-wur-course-2026"
Issues     = "https://github.com/cubert-hyperspectral/cuvis-ai-wur-course-2026/issues"
Changelog  = "https://github.com/cubert-hyperspectral/cuvis-ai-wur-course-2026/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cuvis_ai_wur_course*"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
fallback_version = "0.1.0"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# torchvision MUST come from the same cu128 index as torch, or the prebuilt ops
# (torchvision::nms) mismatch torch's ABI at import.
torchvision = { index = "pytorch-cu128" }
cuvis-ai-sam3 = { git = "https://github.com/cubert-hyperspectral/cuvis-ai-sam3.git", rev = "v0.5.2" }
cuvis-ai-ultralytics = { git = "https://github.com/cubert-hyperspectral/cuvis-ai-ultralytics.git", rev = "v0.1.5" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: small, fast tests that don't touch network or large data files.",
  "integration: full-stack tests (manifest loading via NodeRegistry).",
  "slow: GPU / real-data tests, skipped in CI (run with -m slow).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cuvis_ai_wur_course/upstream", "2025", "2026"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
extend-select = ["ANN201", "ANN202", "ANN204"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN202", "ANN204", "E501", "E702"]
"notebooks/**" = ["ANN201", "ANN202", "E702", "E501", "B905", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests", "build", "dist", "notebooks", "cuvis_ai_wur_course/upstream", "2025", "2026"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", "notebooks", "cuvis_ai_wur_course/upstream", "2025", "2026"]
skips = ["B101"]

[tool.coverage.run]
source = ["cuvis_ai_wur_course"]
omit = ["tests/*", "notebooks/*", "cuvis_ai_wur_course/upstream/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
